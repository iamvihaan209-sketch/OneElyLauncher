name: Nightly Build - macOS Intel

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      # ---------------------------------------------------------
      # Make sure Ely.by is declared as a Rust module.
      # Keep //! crate documentation before mod ely;
      # ---------------------------------------------------------
      - name: Ensure Ely.by module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/lib.rs")
          text = path.read_text()

          # Remove accidental duplicate declarations.
          lines = text.splitlines()
          lines = [line for line in lines if line.strip() != "mod ely;"]

          # Find the first real Rust item, while preserving //! docs.
          insert_at = 0

          while insert_at < len(lines):
              stripped = lines[insert_at].strip()

              if stripped.startswith("//!") or stripped == "":
                  insert_at += 1
              else:
                  break

          lines.insert(insert_at, "mod ely;")

          path.write_text("\n".join(lines) + "\n")
          PY

      # ---------------------------------------------------------
      # Ensure Ely.by hooks are exported through queries/mod.rs.
      # Do NOT touch hooks/mod.rs directly because queries::auth
      # is intentionally private.
      # ---------------------------------------------------------
      - name: Export Ely.by hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/hooks/queries/mod.rs"
          )

          text = path.read_text()

          # Add the Ely.by key type to the existing auth re-export.
          old = (
              "pub use auth::{\n"
              "    AddOfflineAccountKeys,"
          )

          new = (
              "pub use auth::{\n"
              "    AddElyByAccountKeys, AddOfflineAccountKeys,"
          )

          if "AddElyByAccountKeys" not in text:
              if old not in text:
                  raise SystemExit(
                      "Could not find the existing auth re-export block"
                  )

              text = text.replace(old, new, 1)

          # Add the Ely.by mutation hook to the existing auth exports.
          old = (
              "use_add_account"
          )

          # The actual existing block contains these account hooks.
          anchor = (
              "use_add_microsoft_account, use_add_offline_account,"
          )

          replacement = (
              "use_add_ely_by_account, use_add_microsoft_account, "
              "use_add_offline_account,"
          )

          if "use_add_ely_by_account" not in text:
              if anchor not in text:
                  raise SystemExit(
                      "Could not find the existing account hook exports"
                  )

              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Fix accidental pub pub if an older workflow created it.
      # This is deliberately exact and cannot create pub pub.
      # ---------------------------------------------------------
      - name: Repair Ely.by visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/hooks/queries/auth.rs"
          )

          text = path.read_text()

          text = text.replace(
              "pub pub struct AddElyByAccountKeys",
              "pub struct AddElyByAccountKeys"
          )

          text = text.replace(
              "pub pub struct AddElyByAccountMutation",
              "pub struct AddElyByAccountMutation"
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Freya version used by OneLauncher does not expose
      # InputMode::Password.
      # ---------------------------------------------------------
      - name: Fix Ely.by password input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          text = text.replace(
              ".mode(InputMode::Password)",
              ""
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Remove accidental duplicate Ely.by match arms.
      # ---------------------------------------------------------
      - name: Remove duplicate Ely.by match
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          duplicate = (
              'AccountKind::ElyBy => "Ely.by",\n'
              '        AccountKind::ElyBy => "Ely.by",'
          )

          while duplicate in text:
              text = text.replace(
                  duplicate,
                  'AccountKind::ElyBy => "Ely.by",',
                  1
              )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Remove warnings caused by the Ely.by implementation.
      # ---------------------------------------------------------
      - name: Clean Ely.by imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/ely.rs")
          text = path.read_text()

          text = text.replace(
              "use serde::{Deserialize, Serialize};",
              "use serde::Deserialize;"
          )

          path.write_text(text)

          path = Path("packages/oneclient_auth/src/service.rs")
          text = path.read_text()

          text = text.replace(
              "use crate::data::{AccountKind, MicrosoftLoginSession, MinecraftAccount};",
              "use crate::data::{MicrosoftLoginSession, MinecraftAccount};"
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Verify the Intel build.
      # ---------------------------------------------------------
      - name: Cargo check
        run: |
          cargo check \
            -p oneclient_app \
            --target x86_64-apple-darwin

      - name: Cargo build
        run: |
          cargo build \
            -p oneclient_app \
            --release \
            --target x86_64-apple-darwin

      # ---------------------------------------------------------
      # Create .app and .dmg
      # ---------------------------------------------------------
      - name: Package OneLauncher
        run: |
          cargo packager \
            --release \
            -p oneclient_app \
            --formats app,dmg

      # ---------------------------------------------------------
      # Upload Intel artifacts
      # ---------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-nightly-macOS-Intel
          path: |
            target/**/release/*.dmg
            target/**/release/*.app
          if-no-files-found: error

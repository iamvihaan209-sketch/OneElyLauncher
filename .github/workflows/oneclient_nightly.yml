name: Nightly Build - macOS Intel

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      # ---------------------------------------------------------
      # Fix Ely.by module declaration
      # ---------------------------------------------------------
      - name: Fix Ely.by module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/lib.rs")
          text = path.read_text()

          if "\nmod ely;" not in text and not text.startswith("mod ely;"):
              lines = text.splitlines()
              insert_at = 0

              while insert_at < len(lines):
                  line = lines[insert_at].strip()

                  if line.startswith("//!") or line == "":
                      insert_at += 1
                  else:
                      break

              lines.insert(insert_at, "mod ely;")
              path.write_text("\n".join(lines) + "\n")
          PY

      # ---------------------------------------------------------
      # Fix Ely.by hook visibility
      # ---------------------------------------------------------
      - name: Fix Ely.by hook exports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path(
              "packages/oneclient_app/src/hooks/queries/auth.rs"
          )

          text = auth.read_text()

          text = text.replace(
              "struct AddElyByAccountKeys",
              "pub struct AddElyByAccountKeys"
          )

          text = text.replace(
              "struct AddElyByAccountMutation",
              "pub struct AddElyByAccountMutation"
          )

          auth.write_text(text)

          hooks = Path(
              "packages/oneclient_app/src/hooks/mod.rs"
          )

          text = hooks.read_text()

          export = (
              "pub use queries::auth::{"
              "AddElyByAccountKeys, "
              "use_add_ely_by_account"
              "};"
          )

          if "use_add_ely_by_account" not in text:
              text += "\n" + export + "\n"

          hooks.write_text(text)
          PY

      # ---------------------------------------------------------
      # Fix Freya password input
      # ---------------------------------------------------------
      - name: Fix Ely.by password input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          text = text.replace(
              ".mode(InputMode::Password)",
              ""
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Remove duplicate Ely.by match
      # ---------------------------------------------------------
      - name: Remove duplicate Ely.by match
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          duplicate = (
              'AccountKind::ElyBy => "Ely.by",\n'
              '        AccountKind::ElyBy => "Ely.by",'
          )

          text = text.replace(
              duplicate,
              'AccountKind::ElyBy => "Ely.by",'
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Clean unused imports
      # ---------------------------------------------------------
      - name: Clean Ely.by imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/ely.rs")
          text = path.read_text()

          text = text.replace(
              "use serde::{Deserialize, Serialize};",
              "use serde::Deserialize;"
          )

          path.write_text(text)

          path = Path("packages/oneclient_auth/src/service.rs")
          text = path.read_text()

          text = text.replace(
              "use crate::data::{AccountKind, MicrosoftLoginSession, MinecraftAccount};",
              "use crate::data::{MicrosoftLoginSession, MinecraftAccount};"
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Check
      # ---------------------------------------------------------
      - name: Cargo check
        run: |
          cargo check \
            -p oneclient_app \
            --target x86_64-apple-darwin

      # ---------------------------------------------------------
      # Build Intel release
      # ---------------------------------------------------------
      - name: Cargo build
        run: |
          cargo build \
            -p oneclient_app \
            --release \
            --target x86_64-apple-darwin

      # ---------------------------------------------------------
      # Package .app + .dmg
      # ---------------------------------------------------------
      - name: Package
        run: |
          cargo packager \
            --release \
            -p oneclient_app \
            --formats app,dmg

      # ---------------------------------------------------------
      # Upload
      # ---------------------------------------------------------
      - name: Upload Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-nightly-macOS-Intel
          path: |
            target/**/release/*.dmg
            target/**/release/*.app
          if-no-files-found: error

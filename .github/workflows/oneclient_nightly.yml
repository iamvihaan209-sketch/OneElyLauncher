name: Build OneLauncher

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: macos-13
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      - name: Fix Ely.by module declaration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/lib.rs")
          text = path.read_text()

          if "mod ely;" not in text:
              lines = text.splitlines()

              insert_at = 0
              while insert_at < len(lines) and (
                  lines[insert_at].startswith("//")
                  or not lines[insert_at].strip()
              ):
                  insert_at += 1

              lines.insert(insert_at, "mod ely;")
              path.write_text("\n".join(lines) + "\n")
          PY

      - name: Check
        run: cargo check -p oneclient_app --target ${{ matrix.target }}

      - name: Build
        run: cargo build -p oneclient_app --release --target ${{ matrix.target }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cargo packager \
            --release \
            -p oneclient_app \
            --formats app,dmg

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-${{ matrix.os }}
          path: |
            target/**/release/*.dmg
            target/**/release/*.app
            target/**/release/*.AppImage
            target/**/release/*.deb
            target/**/release/*.msi
            target/**/release/*.exe
            target/**/release/oneclient_app
          if-no-files-found: warn

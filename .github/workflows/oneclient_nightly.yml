name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: Nightly ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # Make sure the Ely.by module is declared.
      - name: Fix Ely.by module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/lib.rs")
          text = path.read_text()

          if "mod ely;" not in text:
              text = "mod ely;\n" + text
              path.write_text(text)
          PY

      # Make the Ely.by hooks publicly available to the app.
      - name: Fix Ely.by hook exports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_app/src/hooks/queries/auth.rs")
          text = path.read_text()

          # Ensure the mutation is public.
          text = text.replace(
              "struct AddElyByAccountKeys",
              "pub struct AddElyByAccountKeys"
          )

          text = text.replace(
              "struct AddElyByAccountMutation",
              "pub struct AddElyByAccountMutation"
          )

          path.write_text(text)

          path = Path("packages/oneclient_app/src/hooks/mod.rs")
          text = path.read_text()

          if "AddElyByAccountKeys" not in text:
              text += "\n"
              text += "pub use queries::auth::{AddElyByAccountKeys, use_add_ely_by_account};\n"

          path.write_text(text)
          PY

      # Freya does not provide InputMode::Password in this version.
      - name: Fix Ely.by password input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          text = text.replace(
              ".mode(InputMode::Password)",
              ""
          )

          path.write_text(text)
          PY

      # Remove an accidental duplicate Ely.by match arm.
      - name: Remove duplicate Ely.by match arm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          duplicate = (
              'AccountKind::ElyBy => "Ely.by",\n'
              '        AccountKind::ElyBy => "Ely.by",'
          )

          text = text.replace(
              duplicate,
              'AccountKind::ElyBy => "Ely.by",'
          )

          path.write_text(text)
          PY

      - name: Cargo check
        run: |
          cargo check \
            -p oneclient_app \
            --target ${{ matrix.target }}

      - name: Build
        run: |
          cargo build \
            -p oneclient_app \
            --release \
            --target ${{ matrix.target }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cargo packager \
            --release \
            -p oneclient_app \
            --formats app,dmg

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-nightly-${{ matrix.name }}
          path: |
            target/**/release/*.dmg
            target/**/release/*.app
            target/**/release/*.AppImage
            target/**/release/*.deb
            target/**/release/*.msi
            target/**/release/*.exe
            target/**/release/oneclient_app
          if-no-files-found: warn

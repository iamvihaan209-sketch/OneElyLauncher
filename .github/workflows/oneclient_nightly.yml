name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: Nightly - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin

          # Apple Silicon macOS
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin

          # Linux
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked

      # ---------------------------------------------------------
      # Fix Ely.by module declaration
      # ---------------------------------------------------------
      - name: Fix Ely.by module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/oneclient_auth/src/lib.rs")
          text = path.read_text()

          if "\nmod ely;" not in text and not text.startswith("mod ely;"):
              lines = text.splitlines()

              # Keep //! crate documentation at the beginning.
              insert_at = 0

              while insert_at < len(lines):
                  line = lines[insert_at].strip()

                  if line.startswith("//!") or line == "":
                      insert_at += 1
                  else:
                      break

              lines.insert(insert_at, "mod ely;")
              path.write_text("\n".join(lines) + "\n")
          PY

      # ---------------------------------------------------------
      # Fix Ely.by hook visibility
      # ---------------------------------------------------------
      - name: Fix Ely.by hook exports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path(
              "packages/oneclient_app/src/hooks/queries/auth.rs"
          )

          text = auth.read_text()

          text = text.replace(
              "struct AddElyByAccountKeys",
              "pub struct AddElyByAccountKeys"
          )

          text = text.replace(
              "struct AddElyByAccountMutation",
              "pub struct AddElyByAccountMutation"
          )

          auth.write_text(text)

          hooks = Path(
              "packages/oneclient_app/src/hooks/mod.rs"
          )

          text = hooks.read_text()

          export = (
              "pub use queries::auth::{"
              "AddElyByAccountKeys, "
              "use_add_ely_by_account"
              "};"
          )

          if "use_add_ely_by_account" not in text:
              text += "\n" + export + "\n"

          hooks.write_text(text)
          PY

      # ---------------------------------------------------------
      # Freya does not provide InputMode::Password here
      # ---------------------------------------------------------
      - name: Fix Ely.by password input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          text = text.replace(
              ".mode(InputMode::Password)",
              ""
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Remove accidental duplicate Ely.by match arm
      # ---------------------------------------------------------
      - name: Remove duplicate Ely.by match
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/oneclient_app/src/view/app/settings/accounts.rs"
          )

          text = path.read_text()

          duplicate = (
              'AccountKind::ElyBy => "Ely.by",\n'
              '        AccountKind::ElyBy => "Ely.by",'
          )

          text = text.replace(
              duplicate,
              'AccountKind::ElyBy => "Ely.by",'
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Remove unused imports
      # ---------------------------------------------------------
      - name: Clean Ely.by imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ely.rs
          path = Path("packages/oneclient_auth/src/ely.rs")
          text = path.read_text()

          text = text.replace(
              "use serde::{Deserialize, Serialize};",
              "use serde::Deserialize;"
          )

          path.write_text(text)

          # service.rs
          path = Path("packages/oneclient_auth/src/service.rs")
          text = path.read_text()

          text = text.replace(
              "use crate::data::{AccountKind, MicrosoftLoginSession, MinecraftAccount};",
              "use crate::data::{MicrosoftLoginSession, MinecraftAccount};"
          )

          path.write_text(text)
          PY

      # ---------------------------------------------------------
      # Verify compilation
      # ---------------------------------------------------------
      - name: Cargo check
        run: |
          cargo check \
            -p oneclient_app \
            --target ${{ matrix.target }}

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Cargo build
        run: |
          cargo build \
            -p oneclient_app \
            --release \
            --target ${{ matrix.target }}

      # ---------------------------------------------------------
      # Package macOS
      # ---------------------------------------------------------
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cargo packager \
            --release \
            -p oneclient_app \
            --formats app,dmg

      # ---------------------------------------------------------
      # Package Linux
      # ---------------------------------------------------------
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      # ---------------------------------------------------------
      # Package Windows
      # ---------------------------------------------------------
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cargo packager \
            --release \
            -p oneclient_app

      # ---------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-nightly-${{ matrix.name }}
          path: |
            target/**/release/*.dmg
            target/**/release/*.app
            target/**/release/*.AppImage
            target/**/release/*.deb
            target/**/release/*.msi
            target/**/release/*.exe
            target/**/release/oneclient_app
          if-no-files-found: warn
